name: Generate Static HTML Pages

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering. Tick "regenerate all" after changing the page templates.
    inputs:
      regenerate_all:
        description: 'Regenerate every member page (not just the queue)'
        type: boolean
        default: false

concurrency:
  group: generate-static-html
  cancel-in-progress: false

jobs:
  generate-broker-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install

      - name: Ensure public directory exists
        run: mkdir -p public

      - name: Generate HTML files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGENERATE_ALL: ${{ inputs.regenerate_all && '1' || '' }}
        run: node scripts/generate-broker-html.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/*/ public/sitemap.xml || true
          if git diff --staged --quiet; then
            echo "No HTML files changed, skipping commit"
            exit 0
          fi
          git commit -m "chore: regenerate broker HTML files [skip ci]"
          # main may have moved while the pages were generating: rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Notify on completion
        if: always()
        run: |
          echo "Static HTML generation completed"
          # Add notification logic here if needed (email, Slack, etc.)
